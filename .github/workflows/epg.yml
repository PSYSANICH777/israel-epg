name: TV EPG
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grab
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epgsrc
          cd epgsrc
          npm install
          npm run grab --- --sites=9tv.co.il,mako.co.il --days=4 --maxConnections=3 --output=../new_other.xml || true
      - name: Merge
        run: python tools/merge.py guide.xml new_other.xml
      - name: Commit
        run: |
          rm -rf epgsrc new_other.xml
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          git commit -m "update EPG" || echo "no changes"
          git push
